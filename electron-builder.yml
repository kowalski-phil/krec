appId: com.kowalski.krec
productName: Krec
directories:
  buildResources: assets
  output: dist
files:
  - out/**
  - assets/**
  - package.json
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Krec
  artifactName: ${productName} Setup ${version}.${ext}
