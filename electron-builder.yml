appId: com.kowalski.krec
productName: Krec
directories:
  buildResources: assets
  output: dist
files:
  - out/**
  - assets/**
  - package.json
# FFmpeg must be a real file on disk to be executed, not packed inside app.asar.
asarUnpack:
  - node_modules/ffmpeg-static/**
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Krec
  artifactName: ${productName} Setup ${version}.${ext}
